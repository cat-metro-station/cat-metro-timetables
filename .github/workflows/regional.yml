name: Refresh regional timetables
on:
  schedule:
    - cron: '51 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: regional-timetables
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        region: [uk, us]
    steps:
      - uses: actions/checkout@v4
      - name: Build schedules from public sources
        env:
          REGION: ${{ matrix.region }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidates"
          python3 "tools/refresh_regional_${REGION}.py" --cache "$RUNNER_TEMP/source-cache" --output "$RUNNER_TEMP/candidates"
      - name: Check generation covered every expected city
        if: "${{ !cancelled() }}"
        env:
          REGION: ${{ matrix.region }}
        run: |
          python3 - <<'CHECK'
          import json, os
          from pathlib import Path
          all_cities = set(json.loads(Path("inputs/regional-lines.json").read_bytes()))
          uk = set(json.loads(Path("inputs/regional-uk.json").read_bytes()))
          expected = uk if os.environ["REGION"] == "uk" else all_cities - uk
          candidates = Path(os.environ["RUNNER_TEMP"]) / "candidates"
          actual = {p.stem.removeprefix("offline-") for p in candidates.glob("offline-*.json")}
          if actual != expected:
              raise SystemExit(f"Missing {sorted(expected - actual)}; unexpected {sorted(actual - expected)}")
          print(f"Rebuilt all {len(expected)} {os.environ['REGION'].upper()} cities")
          CHECK
      - name: Save each successfully rebuilt city
        if: "${{ !cancelled() }}"
        uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.region }}
          path: ${{ runner.temp }}/candidates/offline-*.json
          if-no-files-found: warn
          retention-days: 2

  publish:
    if: "${{ !cancelled() }}"
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: ${{ runner.temp }}/candidates
          merge-multiple: true
      - name: Test package validator
        run: python3 -m unittest discover -s tests
      - name: Validate candidates and build atomic index
        id: validate
        continue-on-error: true
        run: python3 tools/publish_regional.py --candidates "$RUNNER_TEMP/candidates"
      - name: Verify all 78 published entries
        run: python3 tools/verify_regional.py
      - name: Publish accepted schedules and index together
        run: |
          git add packages/regional-index.json packages/regional/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh regional offline rail schedules'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report rejected candidates
        if: steps.validate.outcome == 'failure'
        run: exit 1
